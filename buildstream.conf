# BuildStream configuration for CI.
#
# Passed to `just bst` via BST_FLAGS:
#   BST_FLAGS="--config /src/buildstream.conf" just bst build oci/image.bst
#
# The job caps are the point. An unbounded build on a shared runner exhausts
# the process limit and dies with
#   ninja: fatal: posix_spawn: Resource temporarily unavailable
# `scheduler.builders` caps how many elements build at once and `build.max-jobs`
# caps each element's own jobs, so together they bound the process count. Local
# machines are left unbounded; only CI passes this file.

scheduler:
  # A failed element does not abort the whole build, so one bad element reports
  # its own log instead of hiding the rest.
  on-error: continue
  fetchers: 32
  builders: 2
  network-retries: 3

build:
  # Transient resource exhaustion often passes on a second attempt.
  retry-failed: True
  max-jobs: 4

cache:
  # Build trees are large and never needed between runs.
  cache-buildtrees: never
