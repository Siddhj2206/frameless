name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@ae7d740d261d56354aeaf0a72af6f87e442e0472 # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
