name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@9d9e2a467dfe51af6cda1f3f6ec242a3dc44b487 # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
