name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@54ca1f4fffd7a59d90aa2559d3560d04d81d9b0f # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
