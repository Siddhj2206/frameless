name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@0642c0d2a58c8e7bf4f426d41ed76a33bbd9559f # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
