name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@58466c868ec3f0eb2d0daf77bf90f61afcf821ee # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
