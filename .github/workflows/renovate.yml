name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@e1e7f38c35e681f309fee7893f6f6780c23e3bb4 # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
