name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@48a0112c6293d00357eef0ef3a4ce2e54dbdd94a # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
