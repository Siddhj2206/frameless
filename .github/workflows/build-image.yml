---
name: Build and Push Image

# Two-branch model:
#   main   = testing branch, publishes :stable-testing and :testing
#   stable = production branch, receives the exact signed/testing digest through
#            execute-release.yml; it never rebuilds an image.
# promote-main-to-stable.yml opens the scheduled/manual main -> stable promotion
# PR. execute-release.yml runs the release gate and promotes the candidate.
#
# The image is assembled by BuildStream, not a Containerfile: `just bst` runs bst
# in the pinned freedesktop-sdk bst2 container and the resulting OCI layout is
# loaded into podman, so the shared tag/push/sign reusables keep working
# unchanged. See docs/research/05-local-bst-runner.md and
# docs/research/07-dakota-alpha-6.md.
on:
  push:
    branches:
      - main
    paths:
      - "elements/**"
      - "include/**"
      - "files/**"
      - "custom/**"
      - "project.conf"
      - "Justfile"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_VENDOR: "${{ github.repository_owner }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "stable"
  PRODUCTION_BRANCH: "stable" # The branch that publishes :stable production images
  # Rechunking is available through the shared OCI-native chunka action and is
  # off by default. The build-time chunkah-ownership pipeline is a separate
  # decision — see docs/research/07-dakota-alpha-6.md.
  ENABLE_RECHUNKING: "false"
  RECHUNK_MAX_LAYERS: "128"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    # A manual dispatch may select any ref. Limit it to the repository's default
    # branch so it cannot bypass the candidate-digest release path by rebuilding
    # and publishing from stable.
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    # Pinned to 24.04: projectbluefin/actions' setup-runner hard-asserts
    # `ubuntu-24.04` when adding its resolute apt source, so a 26.04 runner
    # fails that step. Renovate is held below 26.04 in renovate.json too.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      # Anything not on the production branch is a testing build. TAG_STREAM
      # keeps generate-tags on the "testing" stream so it never emits
      # stable-daily* aliases that would collide with production; the
      # Finalize branch tags step renames them to stable-testing-*.
      - name: Determine image tag
        id: determine-tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" != "${PRODUCTION_BRANCH}" ]]; then
            echo "DEFAULT_TAG=${DEFAULT_TAG}-testing" >> "${GITHUB_ENV}"
            echo "TAG_STREAM=testing" >> "${GITHUB_ENV}"
            echo "Building testing image: ${DEFAULT_TAG}-testing"
          else
            echo "TAG_STREAM=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
            echo "Building production image: ${DEFAULT_TAG}"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight
        id: preflight
        uses: projectbluefin/actions/bootc-build/preflight@722bdf2e7fda6d5fac91c78c6ed396d7cf9a8dc5 # v1
        with:
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@722bdf2e7fda6d5fac91c78c6ed396d7cf9a8dc5 # v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          update-podman: "true"
          install-tools: '["just"]'

      # BuildStream's artifact cache. The public read-only caches in project.conf
      # cover the FSDK/GBM graph; this persists what we build on top of it, so a
      # run that only changes one element does not rebuild the world. The
      # combined action restores here and saves in a post-step.
      - name: BuildStream cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/buildstream
          key: bst-${{ runner.os }}-${{ hashFiles('project.conf', 'elements/freedesktop-sdk.bst', 'elements/gnome-build-meta.bst') }}
          restore-keys: |
            bst-${{ runner.os }}-

      - name: Build image with BuildStream
        id: build-image
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          set -euo pipefail
          # `just bst` runs bst in the pinned bst2 container and regenerates
          # include/fsdk-version.yml from the FSDK junction ref.
          just bst build oci/image.bst

          # Export the OCI layout and load it into podman so the tag/push/sign
          # reusables below operate on a normal local image. `podman pull` (not
          # skopeo) keeps the loaded view intact for the push.
          rm -rf out
          just bst artifact checkout oci/image.bst --directory /src/out
          IMAGE_ID=$(sudo podman pull -q oci:out)
          sudo podman tag "${IMAGE_ID}" "localhost/${IMAGE_NAME}:${DEFAULT_TAG}"

      - name: Get version label
        id: version
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          VERSION_LABEL=$(sudo podman inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "version=${VERSION_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION_LABEL}"

      - name: Generate tags
        id: generate-tags
        uses: projectbluefin/actions/bootc-build/generate-tags@722bdf2e7fda6d5fac91c78c6ed396d7cf9a8dc5 # v1
        with:
          base-name: ${{ env.IMAGE_NAME }}
          stream-name: ${{ env.TAG_STREAM }}
          version-label: ${{ steps.version.outputs.version }}
          event-name: ${{ github.event_name }}

      # generate-tags emits stream-native tags (testing* or stable-daily* plus
      # version aliases). For testing builds this renames testing* tags to
      # stable-testing-*, keeps the bare :testing tag (the factory release gate
      # in reusable-promote-squash.yml resolves digests from it), and guarantees
      # the mutable consumer tag (:stable / :stable-testing) is always published.
      - name: Finalize branch tags
        id: branch-tags
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.generate-tags.outputs.tags }}
        run: |
          read -r -a generated_tags <<< "${GENERATED_TAGS}"
          branch_tags=()

          add_tag() {
            local candidate="$1"
            local existing
            for existing in "${branch_tags[@]}"; do
              [[ "${existing}" == "${candidate}" ]] && return
            done
            branch_tags+=("${candidate}")
          }

          for tag in "${generated_tags[@]}"; do
            if [[ "${TAG_STREAM}" == "testing" ]]; then
              # Bare :testing stays so the promotion release gate can resolve it.
              [[ "${tag}" == "testing" ]] && add_tag "${tag}"
              add_tag "${tag/testing/stable-testing}"
            else
              add_tag "${tag}"
            fi
          done
          add_tag "${DEFAULT_TAG}"

          echo "tags=${branch_tags[*]}" >> "${GITHUB_OUTPUT}"
          echo "default-tag=${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"

      # OPTIONAL: set ENABLE_RECHUNKING to "true" above for smaller OTA deltas.
      # This is the shared OCI-native chunka action, which runs on the local
      # image; the build-time chunkah-ownership pipeline alpha 6 uses is a
      # separate decision (docs/research/07-dakota-alpha-6.md).
      - name: Rechunk image
        if: env.ENABLE_RECHUNKING == 'true'
        id: rechunk-image
        uses: projectbluefin/actions/bootc-build/chunka@722bdf2e7fda6d5fac91c78c6ed396d7cf9a8dc5 # v1
        with:
          source-image: localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          max-layers: ${{ env.RECHUNK_MAX_LAYERS }}

      - name: Tag images
        shell: bash
        env:
          ALIAS_TAGS: ${{ steps.branch-tags.outputs.tags }}
        run: |
          sudo -E "$(command -v just)" tag-images "${IMAGE_NAME}" \
                          "${DEFAULT_TAG}" \
                          "${ALIAS_TAGS}"

      # Every build here is a candidate build from main and publishes tags.
      # execute-release.yml promotes the signed, gated candidate digest to
      # :stable without a stable-branch rebuild, so the upstream push-image
      # action owns all registry authentication and pushing.

      - name: Push to GHCR
        id: push
        uses: projectbluefin/actions/bootc-build/push-image@722bdf2e7fda6d5fac91c78c6ed396d7cf9a8dc5 # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.branch-tags.outputs.tags }}
          default-tag: ${{ steps.branch-tags.outputs.default-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Sign and attest (SLSA Build L2 provenance). Bluefin pattern: keyless OIDC
      # signing via Fulcio; requires 'id-token: write' (granted above). Signing
      # failures do not block candidate publication, but the release gate rejects
      # an unsigned candidate and preserves the prior :stable.
      - name: Sign and publish
        continue-on-error: true
        uses: projectbluefin/actions/bootc-build/sign-and-publish@722bdf2e7fda6d5fac91c78c6ed396d7cf9a8dc5 # v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          generate-sbom: false
          push-attestation: true
          certificate-identity-regexp: https://github.com/${{ github.repository }}/.github/workflows/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build telemetry summary
        shell: bash
        run: |
          IMAGE_SIZE=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")
          IMAGE_SIZE_MB=$(( IMAGE_SIZE / 1024 / 1024 ))
          LAYER_COUNT=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{len .RootFS.Layers}}' 2>/dev/null || echo "?")

          {
            echo "## Build Telemetry: ${{ env.IMAGE_NAME }}"
            echo ""
            echo "**Image size (uncompressed):** ${IMAGE_SIZE_MB} MB"
            echo "**Layer count:** ${LAYER_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"
