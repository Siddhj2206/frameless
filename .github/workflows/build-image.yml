---
name: Build and Push Image

# Two-branch model:
#   main   = testing branch, publishes :stable-testing and :testing
#   stable = production branch, receives the exact signed/testing digest through
#            execute-release.yml; it never rebuilds an image.
# promote-main-to-stable.yml opens the scheduled/manual main -> stable promotion
# PR. execute-release.yml runs the release gate and promotes the candidate.
#
# The image is assembled by BuildStream, not a Containerfile: `just bst` runs bst
# in the pinned freedesktop-sdk bst2 container and the resulting OCI layout is
# loaded into podman, so the shared tag/push/sign reusables keep working
# unchanged. See docs/research/05-local-bst-runner.md and
# docs/research/07-dakota-alpha-6.md.
on:
  push:
    branches:
      - main
    paths:
      - "elements/**"
      - "include/**"
      - "files/**"
      - "custom/**"
      - "project.conf"
      - "Justfile"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "stable"
  PRODUCTION_BRANCH: "stable" # The branch that publishes :stable production images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    # A manual dispatch may select any ref. Limit it to the repository's default
    # branch so it cannot bypass the candidate-digest release path by rebuilding
    # and publishing from stable.
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    # Pinned to 24.04: projectbluefin/actions' setup-runner hard-asserts
    # `ubuntu-24.04` when adding its resolute apt source, so a 26.04 runner
    # fails that step. Renovate is held below 26.04 in renovate.json too.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      # Anything not on the production branch is a testing build. TAG_STREAM
      # keeps generate-tags on the "testing" stream so it never emits
      # stable-daily* aliases that would collide with production; the
      # Finalize branch tags step renames them to stable-testing-*.
      - name: Image tag
        id: determine-tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" != "${PRODUCTION_BRANCH}" ]]; then
            echo "DEFAULT_TAG=${DEFAULT_TAG}-testing" >> "${GITHUB_ENV}"
            echo "TAG_STREAM=testing" >> "${GITHUB_ENV}"
            echo "Building testing image: ${DEFAULT_TAG}-testing"
          else
            echo "TAG_STREAM=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
            echo "Building production image: ${DEFAULT_TAG}"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight
        id: preflight
        uses: projectbluefin/actions/bootc-build/preflight@f862ab6946fb10e5566bfda8336fd58cedb3b9c3 # v1
        with:
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@f862ab6946fb10e5566bfda8336fd58cedb3b9c3 # v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          update-podman: "true"
          install-tools: '["just"]'

      # oras moves the cache artifact. setup-runner installs it only
      # conditionally — it is skipped in this job — so install it here.
      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      # The BuildStream cache travels as a GHCR OCI artifact rather than through
      # actions/cache: the cache is ~14 GB and the per-repo cache limit is
      # 10 GB, so the entry was evicted and every run started cold. GHCR
      # container storage and bandwidth are free and uncapped. See
      # scripts/bst-cache-oci.sh.
      #
      # The public read-only caches in project.conf still cover the FSDK/GBM
      # graph; this persists what we build on top of it, so a run that only
      # changes one element does not rebuild the world.
      - name: Restore cache
        # The cache is an optimisation; a registry problem must not fail a build.
        continue-on-error: true
        env:
          BST_CACHE_REF: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}-cache
          BST_CACHE_KEY: bst-${{ runner.os }}-${{ hashFiles('project.conf', 'elements/freedesktop-sdk.bst', 'elements/gnome-build-meta.bst') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: just cache-pull

      - name: Build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build-image
        env:
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          BUILD_IMAGE_TAG: ${{ env.DEFAULT_TAG }}
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          # Cap parallel jobs; an unbounded build exhausts the runner's process
          # limit. See buildstream.conf.
          BST_FLAGS: "--config /src/buildstream.conf"
        run: |
          set -euo pipefail
          # `just export` builds oci/image.bst, loads the OCI layout into podman,
          # and binds the chunkah ownership sidecar to the loaded image. It
          # regenerates include/fsdk-version.yml from the FSDK junction ref.
          just export
          # Rechunk so OTA updates are content-addressed and smaller. This
          # consumes the ownership sidecar export just bound.
          just chunkify "${IMAGE_NAME}:${DEFAULT_TAG}"

      # `latest` is written even when the build failed — while the graph is
      # being tuned the failing run is the common case, and what it built is
      # exactly what the next run should not repeat. The graph-keyed tag is
      # written only for a complete build, so a partial cache cannot claim to be
      # the complete one for a graph.
      - name: Save cache
        if: always()
        # A push failure must never block the publish that follows.
        continue-on-error: true
        env:
          BST_CACHE_REF: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}-cache
          BST_CACHE_KEY: bst-${{ runner.os }}-${{ hashFiles('project.conf', 'elements/freedesktop-sdk.bst', 'elements/gnome-build-meta.bst') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "${{ steps.build-image.outcome }}" != "success" ]; then
            unset BST_CACHE_KEY
          fi
          just cache-push

      - name: Version label
        id: version
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          VERSION_LABEL=$(sudo podman inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "version=${VERSION_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION_LABEL}"

      # The image bakes its own upgrade origin (IMAGE_REF) from
      # image-registry-owner in project.conf. If that does not match where CI
      # publishes, `bootc upgrade` points at a repository that does not exist,
      # and nothing else would catch it. Fail here instead.
      - name: Verify upgrade origin
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
        run: |
          set -euo pipefail
          ref="localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          mount=$(sudo podman image mount "${ref}")
          trap 'sudo podman image umount "${ref}" >/dev/null 2>&1 || true' EXIT
          # The mount belongs to the privileged store, so read it with the same
          # privilege — as `just chunkify` does, for the same reason.
          actual=$(sudo sed -n 's/^IMAGE_REF="\(.*\)"$/\1/p' "${mount}/usr/lib/os-release")
          expected="ostree-image-signed:docker://${IMAGE_REGISTRY}/${IMAGE_NAME}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::the image's upgrade origin is '${actual}' but CI publishes to '${expected}'. Set image-vendor in project.conf to '${IMAGE_REGISTRY##*/}'."
            exit 1
          fi
          echo "Upgrade origin matches the publish target: ${actual}"

      - name: Generate tags
        id: generate-tags
        uses: projectbluefin/actions/bootc-build/generate-tags@f862ab6946fb10e5566bfda8336fd58cedb3b9c3 # v1
        with:
          base-name: ${{ env.IMAGE_NAME }}
          stream-name: ${{ env.TAG_STREAM }}
          version-label: ${{ steps.version.outputs.version }}
          event-name: ${{ github.event_name }}

      # generate-tags emits stream-native tags (testing* or stable-daily* plus
      # version aliases). For testing builds this renames testing* tags to
      # stable-testing-*, keeps the bare :testing tag (the factory release gate
      # in reusable-promote-squash.yml resolves digests from it), and guarantees
      # the mutable consumer tag (:stable / :stable-testing) is always published.
      - name: Finalize tags
        id: branch-tags
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.generate-tags.outputs.tags }}
        run: |
          read -r -a generated_tags <<< "${GENERATED_TAGS}"
          branch_tags=()

          add_tag() {
            local candidate="$1"
            local existing
            for existing in "${branch_tags[@]}"; do
              [[ "${existing}" == "${candidate}" ]] && return
            done
            branch_tags+=("${candidate}")
          }

          for tag in "${generated_tags[@]}"; do
            if [[ "${TAG_STREAM}" == "testing" ]]; then
              # Bare :testing stays so the promotion release gate can resolve it.
              [[ "${tag}" == "testing" ]] && add_tag "${tag}"
              add_tag "${tag/testing/stable-testing}"
            else
              add_tag "${tag}"
            fi
          done
          add_tag "${DEFAULT_TAG}"

          echo "tags=${branch_tags[*]}" >> "${GITHUB_OUTPUT}"
          echo "default-tag=${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"

      # Every build here is a candidate build from main and publishes tags.
      # execute-release.yml promotes the signed, gated candidate digest to
      # :stable without a stable-branch rebuild, so the upstream push-image
      # action owns all registry authentication, tagging, and pushing.

      - name: Push to GHCR
        id: push
        uses: projectbluefin/actions/bootc-build/push-image@f862ab6946fb10e5566bfda8336fd58cedb3b9c3 # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.branch-tags.outputs.tags }}
          default-tag: ${{ steps.branch-tags.outputs.default-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Sign and attest (SLSA Build L2 provenance). Bluefin pattern: keyless OIDC
      # signing via Fulcio; requires 'id-token: write' (granted above). Signing
      # failures do not block candidate publication, but the release gate rejects
      # an unsigned candidate and preserves the prior :stable.
      - name: Sign and publish
        continue-on-error: true
        uses: projectbluefin/actions/bootc-build/sign-and-publish@f862ab6946fb10e5566bfda8336fd58cedb3b9c3 # v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          generate-sbom: false
          push-attestation: true
          certificate-identity-regexp: https://github.com/${{ github.repository }}/.github/workflows/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Telemetry
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -uo pipefail
          local_ref="localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          uncompressed=$(sudo podman image inspect "${local_ref}" --format '{{.Size}}' 2>/dev/null || echo 0)
          layers=$(sudo podman image inspect "${local_ref}" --format '{{len .RootFS.Layers}}' 2>/dev/null || echo '?')

          # Compressed is the number users download, and it only exists in the
          # registry: read the pushed manifest back and sum its layer sizes.
          # Referenced by digest rather than tag, so a concurrent push cannot
          # change what is measured.
          compressed=$(skopeo inspect --raw "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" 2>/dev/null \
            | python3 -c 'import json,sys; print(sum(l["size"] for l in json.load(sys.stdin)["layers"]))' 2>/dev/null || echo 0)

          to_mb() { echo $(( ${1:-0} / 1024 / 1024 )); }

          {
            echo "## Build Telemetry: ${IMAGE_NAME}"
            echo ""
            echo "**Compressed (what users download):** $(to_mb "${compressed}") MB"
            echo "**Uncompressed:** $(to_mb "${uncompressed}") MB"
            echo "**Layers:** ${layers}"
          } >> "${GITHUB_STEP_SUMMARY}"
