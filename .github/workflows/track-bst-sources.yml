name: Track BuildStream Sources

# Renovate tracks GitHub Actions and container digests, but BuildStream
# commit/digest refs — the junctions and the git/docker sources — can only be
# refreshed by BuildStream itself (`bst source track`), because Renovate cannot
# resolve a git-describe ref. This runs `just track` and opens a PR.
#
# Never automerged: a ref bump must build first. Note that a PR opened with the
# default GITHUB_TOKEN does not trigger other workflows, so its checks may need
# a manual re-run; a PAT with the `workflow` scope avoids that.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Approving the check runs GitHub holds for a bot-authored PR.
  actions: write

concurrency:
  group: track-bst-sources
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Track source refs
        run: just track

      - name: Open a PR if anything moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source refs moved."
            exit 0
          fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="auto/track-bst-sources"
          git checkout -B "${branch}"
          git add elements/
          git commit -m "chore(deps): track BuildStream source refs"
          git push --force-with-lease origin "${branch}"
          if gh pr view "${branch}" >/dev/null 2>&1; then
            echo "Existing PR updated."
          else
            gh pr create --base main --head "${branch}" \
              --title "chore(deps): track BuildStream source refs" \
              --body "Refreshed with \`just track\` (\`bst source track\`). Never automerged: the image must build first."
          fi

      # GitHub holds every check run it creates for a bot-authored pull request
      # in `action_required` until someone approves it. Approve them seconds
      # after the branch is pushed, as promote-main-to-stable.yml does.
      - name: Approve the checks GitHub holds for the bot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: auto/track-bst-sources
        run: |
          set -euo pipefail
          runs_filter=".workflow_runs[] | select(.head_branch == \"${BRANCH}\") | select(.actor.login == \"github-actions[bot]\") | .id"
          approved=0
          for attempt in 1 2 3 4 5 6; do
            mapfile -t run_ids < <(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=action_required&per_page=100" \
                --jq "${runs_filter}"
            )
            if [ "${#run_ids[@]}" -gt 0 ]; then
              for run_id in "${run_ids[@]}"; do
                if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" >/dev/null; then
                  echo "Approved run ${run_id}"
                  approved=$((approved + 1))
                else
                  echo "::warning::Could not approve run ${run_id}"
                fi
              done
              break
            fi
            if [ "${attempt}" -lt 6 ]; then
              sleep 15
            fi
          done
          if [ "${approved}" -eq 0 ]; then
            echo "::notice::No pending runs matched; nothing to approve."
          fi
