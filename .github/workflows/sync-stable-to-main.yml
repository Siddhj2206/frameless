---
name: Sync stable to main

# After each squash-merge promotion (main → stable), the squash commit exists
# only on stable. Since the trees are identical this workflow normally no-ops;
# if a hotfix ever lands on stable directly, it is merged back into main so
# the next promotion PR is not blocked.
#
# Thin caller for the factory reusable in projectbluefin/actions, matching
# bluefin's sync-main-to-testing.yml.

on:
  push:
    branches:
      - stable
  # Deliberately NOT dispatchable. The reusable force-resets the target to the
  # source when the target has commits the source lacks, and here the source is
  # `stable` and the target is `main`. If `stable` is ever behind `main`, a
  # manual run would reset `main` to `stable`. The normal trigger (a push to
  # `stable`, which only a promotion produces) always leaves the two trees
  # identical, so the reusable's tree check skips and nothing is pushed.
  #
  # To repair a diverged branch model by hand, reconcile `stable` from `main`
  # (the promotion path), never by dispatching this workflow.

permissions:
  contents: write

concurrency:
  group: sync-stable-to-main
  cancel-in-progress: false

jobs:
  sync:
    name: Keep main up-to-date with stable
    uses: projectbluefin/actions/.github/workflows/reusable-sync-branches.yml@f862ab6946fb10e5566bfda8336fd58cedb3b9c3 # v1
    permissions:
      contents: write
    with:
      source_branch: stable
      target_branch: main
