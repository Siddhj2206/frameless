###############################################################################
# PROJECT CONFIGURATION
###############################################################################
# Name: frameless
#
# This file is the source of truth for the project: its identity, the base
# junctions it composes, and the shared caches it pulls from. It takes over the
# role the Containerfile's identity block used to play.
#
# Rename the project for your own image: change `name` below, then
# `image-vendor` and `image-description` under `variables`. `name` namespaces
# every artifact BuildStream produces and is read by the identity elements as
# %{project-name}, so it is the one place the image name is defined.
#
# Elements live under `elements/`; shared YAML fragments under `include/`. The
# base stack comes from two junctions — freedesktop-sdk (the OS) and
# gnome-build-meta (the desktop) — each pinned in its own element under
# `elements/`. See docs/research/04-buildstream-version-junctions.md.
###############################################################################

name: frameless

# Minimum BuildStream release. 2.8 is current stable, and gnome-build-meta's
# gnome-51 branch requires >= 2.6, so 2.5 cannot load this graph.
min-version: 2.8

# Subdirectory that holds the .bst elements.
element-path: elements

# Shared YAML pulled in with the (@) directive: our alias table, plus the
# freedesktop-sdk runtime variables carried through the gnome-build-meta
# junction. The including file wins over the included one.
(@):
  - gnome-build-meta.bst:freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml

options:
  # Architecture axis. Elements and junctions read %{arch}; sandbox.build-arch
  # keeps the sandbox consistent with it. Build one arch per invocation.
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64

sandbox:
  build-arch: "%{arch}"

variables:
  # ── Image identity ───────────────────────────────────────────────────
  # Change these for your project. The os-release and OCI label elements read
  # them, so this is the one place the image identity is defined. The image
  # name is %{project-name} (the `name` above).
  image-vendor: frameless
  image-description: "A BuildStream OS image built with frameless"

  # Go's arch spelling, for the rare element that needs it.
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
    - arch == "aarch64":
        go-arch: "arm64"

# Default target: `just bst build` with no element builds the image.
defaults:
  targets:
    - oci/image.bst

# ── Shared caches ──────────────────────────────────────────────────────
# Read-only public artifact and source caches. Pulling from these makes a cold
# build tractable and needs no credentials; BuildStream does not push to them.
# Add a writable cache in your user config or CI, never here.
artifacts:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.freedesktop-sdk.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

source-caches:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.freedesktop-sdk.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

# ── Plugins ────────────────────────────────────────────────────────────
# Plugins come from junctioned upstream projects, pinned in elements/plugins/.
# Add `origin: local, path: plugins` here if you write your own element or
# source plugin.
plugins:
  - origin: junction
    junction: plugins/buildstream-plugins.bst
    elements:
      - autotools
      - meson
      - cmake
      - make
    sources:
      - patch
      - docker

  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      - collect_manifest
      - flatpak_image
      - flatpak_repo
      - ostree
      - pyproject
    sources:
      - cargo2
      - git_module
      - git_repo
      - patch_queue
      - zip

  - origin: junction
    junction: gnome-build-meta.bst
    elements:
      - collect_initial_scripts

sources:
  git_repo:
    config:
      ref-format: git-describe
