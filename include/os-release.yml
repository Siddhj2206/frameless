# Shared os-release / image-info.json generator.
#
# Instantiated by elements/oci/os-release.bst, which the layer stack depends on
# and which overrides gnome-build-meta's oci/integration/os-release.bst. The
# image identity comes from project.conf (`name` → %{project-name},
# `image-vendor`, `image-description`); only structural values live here, so
# renaming the project renames the image.
#
# If an instantiating element declares its own build-depends, YAML composition
# REPLACES this list (no merge) — carry the sandbox tools along.
kind: manual

build-depends:
  - core/sandbox-tools.bst

depends:
  - freedesktop-sdk.bst:public-stacks/runtime-minimal.bst

variables:
  strip-binaries: ""

environment:
  IMAGE_NAME: "%{project-name}"
  IMAGE_VENDOR: "%{image-vendor}"
  IMAGE_REF: "ostree-image-signed:docker://ghcr.io/%{image-vendor}/%{project-name}"
  IMAGE_FLAVOR: "main"
  IMAGE_TAG: "latest"
  VERSION: "%{fsdk-version}"
  VERSION_ID: "%{fsdk-version}"
  IMAGE_VERSION: "%{fsdk-version}"

  IMAGE_PRETTY_NAME: "%{project-name}"
  HOME_URL: "https://github.com/Siddhj2206/frameless"
  DOCUMENTATION_URL: "https://github.com/Siddhj2206/frameless/blob/main/README.md"
  SUPPORT_URL: "https://github.com/Siddhj2206/frameless/issues"
  BUG_REPORT_URL: "https://github.com/Siddhj2206/frameless/issues/new"
  CODE_NAME: "frameless"
  ID: "frameless"
  ID_LIKE: "org.gnome.os"

config:
  build-commands:
    - mkdir -p %{install-root}%{indep-libdir}/
    - |
      cat >"%{install-root}%{indep-libdir}/os-release" <<EOF
      NAME="${IMAGE_PRETTY_NAME}"
      ID="${ID}"
      ID_LIKE="${ID_LIKE}"
      VERSION="${VERSION}"
      VERSION_CODENAME="${CODE_NAME}"
      PRETTY_NAME="${IMAGE_PRETTY_NAME}"
      BUG_REPORT_URL="${BUG_REPORT_URL}"
      HOME_URL="${HOME_URL}"
      DOCUMENTATION_URL="${DOCUMENTATION_URL}"
      SUPPORT_URL="${SUPPORT_URL}"
      LOGO=img-logo-icon
      DEFAULT_HOSTNAME="${IMAGE_NAME}"
      IMAGE_NAME="${IMAGE_NAME}"
      IMAGE_VENDOR="${IMAGE_VENDOR}"
      IMAGE_REF="${IMAGE_REF}"
      IMAGE_FLAVOR="${IMAGE_FLAVOR}"
      IMAGE_TAG="${IMAGE_TAG}"
      VERSION_ID="${VERSION_ID}"
      IMAGE_VERSION="${IMAGE_VERSION}"
      EOF
      mkdir -p %{install-root}%{sysconfdir}/
      ln -sf ../usr/lib/os-release %{install-root}%{sysconfdir}/os-release

    - mkdir -p "%{install-root}%{datadir}/ublue-os"
    - |
      cat >"%{install-root}%{datadir}/ublue-os/image-info.json" <<EOF
      {
        "image-name": "${IMAGE_NAME}",
        "image-ref": "${IMAGE_REF}",
        "image-flavor": "${IMAGE_FLAVOR}",
        "image-vendor": "${IMAGE_VENDOR}",
        "image-tag": "${IMAGE_TAG}"
      }
      EOF
